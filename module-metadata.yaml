schemaVersion: 1
modules:
  - moduleId: zalava-module-tika
    version: 0.1.0-alpha.6
    displayName: Apache Tika Content Extractor
    description: Bounded Apache Tika 4 content extraction for Zalava knowledge sources.
    supportUrl: https://github.com/Zalava/zalava-module-tika
    artifact:
      groupId: org.zalava.modules
      artifactId: zalava-module-tika
      version: 0.1.0-alpha.6
    source:
      repository: https://github.com/Zalava/zalava-module-tika.git
      license: Apache-2.0
    build:
      command: ["./gradlew", "build"]
      verificationCommand: ["./gradlew", "test"]
    compatibility:
      zalavaRuntime: ">=1.0.0 <2.0.0"
    configurationSchema:
      type: object
      additionalProperties: false
      properties:
        services:
          type: object
          title: OCR setup
          description: Optional settings for extracting text from scanned documents.
          additionalProperties: false
          properties:
            ocrWorkerUrl:
              type: string
              format: uri
              title: Local OCR worker URL
              description: Enter the address of a running OCR worker on this computer. Leave blank to use the Zalava-managed worker after an administrator approves it.
            ocrLanguages:
              type: string
              title: OCR languages
              description: English (eng) is used when blank. Join language codes with + to recognize more than one language.
              default: eng
              examples: [eng, spa, cat, eng+spa]
              pattern: "^[a-z]{3}(\\+[a-z]{3})*$"
    factories:
      - factoryId: services
        providerType: content-extractor
    services:
      provided:
        - serviceId: content-extractor
          contractVersion: "1"
      required: []
    operations: []
    security:
      permissions: []
